<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio terminal</title>
<style>
  :root { --bg:#101014; --fg:#e8e8ee; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --fg:#16161a; } }
  html { background:var(--bg); }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--fg); }

  #stage-wrap { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
#stage { position:absolute; right: 7rem; top:40%; transform:translateY(-50%); width:max-content; max-width:100%; }
  #bg {
    margin:0; font:10px/10px ui-monospace, Menlo, Consolas, monospace;
    white-space:pre; opacity:.55; user-select:none;
  }
  #window-layer { position:fixed; inset:0; z-index:0; pointer-events:none; }
  #window-layer.is-dragging { z-index:2; }
  .portfolio-window {
    display:none; position:absolute; z-index:2; right:1rem; top:50%; transform:translateY(-50%);
    box-sizing:border-box; width:min(54rem, calc(100vw - 3.5rem)); height:min(44rem, calc(100vh - 6rem));
    background:color-mix(in srgb, #000 75%, var(--bg));
    border:1px solid color-mix(in srgb, var(--fg) 15%, transparent);
    box-shadow:0 .5rem 1.5rem #0005; padding:.75rem 1.25rem 1.25rem; overflow:auto;
    white-space:pre-wrap; font:15px/1.5 ui-monospace, Menlo, Consolas, monospace;
    pointer-events:auto;
  }
  .portfolio-title {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:.25rem; line-height:1.2;
    cursor:grab; user-select:none;
    border-bottom:1px solid color-mix(in srgb, var(--fg) 15%, transparent);
  }
  .portfolio-title:active { cursor:grabbing; }
  .portfolio-title button {
    padding:0 .25rem; border:0; color:inherit; background:transparent;
    font:inherit; line-height:1; cursor:pointer;
  }
  .portfolio-content { padding-top:.35rem; }
  .portfolio-window.is-opening,
  .portfolio-window.is-open { display:block; }
  .portfolio-window.is-opening { animation:terminal-load .5s ease-out both; }
  @keyframes terminal-load {
    from { opacity:0; transform:translateY(-47%) scale(.98); }
    to { opacity:1; transform:translateY(-50%) scale(1); }
  }

  #terminal {
    position:relative; z-index:1; box-sizing:border-box; width:min(48rem, calc(100% - 3rem));
    height:min(51rem, 60vh); margin:1rem 2rem; padding:1.25rem;
    overflow:hidden; background:color-mix(in srgb, #000 75%, var(--bg));
    border:1px solid color-mix(in srgb, var(--fg) 15%, transparent);
    box-shadow:0 .5rem 1.5rem #0005; font:15px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  #output {
    max-height:18em; overflow-y:auto; overflow-x:hidden;
    white-space:pre-wrap; overflow-wrap:anywhere;
    scrollbar-width:none;
  }
  #output::-webkit-scrollbar { display:none; }
  .ghana-flag {
    display:block; width:max-content; margin:.25em auto; padding:.1em .6em;
    background:#9191ff; text-align:center; line-height:1.2;
  }
  .ghana-flag span { display:block; width:8ch; text-align:center; font-weight:700; }
  .flag-red { color:#ce1126; }
  .flag-yellow { color:#fcd116; }
  .flag-green { color:#006b3f; }
  .ghana-flag .flag-star { display:inline; width:auto; color:#111; font-weight:400; }
  .about-td { color:#238b45; }
  .about-mcmaster { color:#7a003c; }
  .about-nsbe-yellow { color:#fcd116; }
  .about-nsbe-brown { color:#8b4513; }
  .about-exoskeleton { color:#d4a017; }
  .portfolio-user { color:#00d75f; }
  .portfolio-host { color:#00afff; }
  .portfolio-name { color:#d787ff; }
  .portfolio-path { color:#ffff00; }
  .portfolio-prompt { color:#ff5f5f; }
  .portfolio-entry-number { color:#00afff; }
  .portfolio-link { color:#5fd7ff; text-decoration:underline; }
  .portfolio-option {
    display:block; width:100%; padding:0; border:0; color:inherit;
    background:transparent; font:inherit; line-height:inherit; text-align:left;
    appearance:none; outline:none;
    cursor:inherit;
  }
  #output .open-notice { color:#fff; font-weight:600; }
  #command-line { display:flex; align-items:baseline; }
  #prompt { flex:none; }
  #command-wrap { position:relative; flex:1; min-width:0; }
  #command {
    width:100%; min-width:0; padding:0; border:0; outline:0; color:inherit;
    caret-color:transparent;
    background:transparent; font:inherit;
  }
  #block-cursor {
    position:absolute; top:.2em; left:0; width:.6em; height:1em;
    box-sizing:border-box; background:transparent; border:1px solid var(--fg);
    pointer-events:none;
  }
  #command-wrap:focus-within #block-cursor { background:#fff; border-color:#fff; }
  #measure {
    position:absolute; visibility:hidden; white-space:pre; font:inherit;
  }
  @media (max-width: 600px) {
    #terminal { width:calc(100% - 2rem); height:60vh; margin:1rem; padding:.9rem; }
    #stage { right:0; }
    .portfolio-window { width:calc(100vw - 2rem); height:calc(100vh - 4rem); right:1rem; padding:.75rem 1rem 1rem; font-size:13px; }
  }
  @media (max-width: 900px) and (orientation: portrait),
         (max-aspect-ratio: 6 / 5) {
    #terminal {
      width:min(48rem, calc(100% - 2rem), 72vh);
      height:min(51rem, 64vh);
      margin:1rem auto;
    }
    .portfolio-window {
      width:min(54rem, calc(100vw - 2rem), 72vh);
      height:min(44rem, calc(100vh - 4rem), 72vh);
      right:1rem;
    }
    #stage { right:1rem; }
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <pre id="bg"></pre>
  </div>
</div>
<div id="window-layer" aria-label="Open terminal windows"></div>
<section id="terminal" aria-label="Interactive portfolio terminal">
  <div id="output" aria-live="polite"></div>
  <form id="command-line">
    <span id="prompt">PS C:\Ontario\Hamilton&gt;&nbsp;</span>
    <span id="command-wrap">
      <input id="command" name="command" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="Terminal command" autofocus>
      <span id="block-cursor" aria-hidden="true"></span>
      <span id="measure" aria-hidden="true"></span>
    </span>
  </form>
</section>
<script src="ascii-player.js"></script>
<script>
  const bg = document.getElementById('bg');
  const player = new AsciiPlayer(bg);
  const jukebox = new Jukebox(player, { dir: 'clips' });  // clips/ holds clip_AAA.txt and playlist.json

  const output = document.getElementById('output');
  const command = document.getElementById('command');
  const blockCursor = document.getElementById('block-cursor');
  const measure = document.getElementById('measure');
  const windowLayer = document.getElementById('window-layer');
  const history = [];
  let historyIndex = 0;
  let openPromptActive = false;
  let projectPromptActive = false;
  let closeSitePromptActive = false;
  let videoOpen = true;
  const openTabs = [];
  let activeTab = '';

  let portfolioCategories = [];

  function updateCursor() {
    measure.textContent = command.value.slice(0, command.selectionStart ?? command.value.length);
    blockCursor.style.left = `${Math.min(measure.getBoundingClientRect().width, command.clientWidth)}px`;
  }

  command.addEventListener('input', updateCursor);
  command.addEventListener('keyup', updateCursor);
  command.addEventListener('click', updateCursor);
  command.addEventListener('focus', updateCursor);
  updateCursor();

  function print(text = '') {
    output.append(document.createTextNode(text + '\n'));
    output.scrollTop = output.scrollHeight;
  }

  function formatDate(value) {
    if (!value) return 'unavailable';
    return new Intl.DateTimeFormat('en-US', {
      month: 'numeric',
      day: 'numeric',
      year: 'numeric',
      timeZone: 'America/New_York'
    }).format(new Date(value));
  }

  function formatDuration(start) {
    const elapsed = Math.max(0, Date.now() - new Date(start).getTime());
    const totalSeconds = Math.floor(elapsed / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const time = [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
    return days ? `${days}d ${time}` : time;
  }

  function renderTracker() {
    const entry = document.createElement('div');
    const duration = document.createElement('span');
    const siteUrl = trackerConfig?.siteUrl;
    entry.append(
      document.createTextNode(`AliFuta Extension v${formatDate(trackerData?.lastUpdated)}\n`),
      document.createTextNode(`${trackerConfig?.studentLine || 'Student (ENG) McMaster University.'}\n`)
    );
    entry.append(document.createTextNode(siteUrl || 'site unavailable'));
    entry.append(
      document.createTextNode(`.\n\n${trackerData?.visits ?? 'unavailable'} Visits\nOnline: `),
      duration,
      document.createTextNode('')
    );
    output.append(entry);
    const updateDuration = () => { duration.textContent = formatDuration(trackerConfig.onlineSince); };
    updateDuration();
    window.setInterval(updateDuration, 1000);
  }

  function clearTerminal() {
    output.replaceChildren();
    output.style.height = '0px';
  }

  function appendBoldCommands(container, text) {
    const parts = text.split(/\b(open|close)\b/gi);
    parts.forEach(part => {
      if (/^(open|close)$/i.test(part)) {
        const bold = document.createElement('strong');
        bold.textContent = part;
        container.append(bold);
      } else {
        container.append(document.createTextNode(part));
      }
    });
  }

  function appendHighlightedText(container, text) {
    const pattern = /\[\[(TD|MCMASTER|NSBE_YELLOW|NSBE_BROWN|EXOSKELETON)\]\]([\s\S]*?)\[\[\/\1\]\]/g;
    let lastIndex = 0;
    let match;
    const classes = {
      TD: 'about-td',
      MCMASTER: 'about-mcmaster',
      NSBE_YELLOW: 'about-nsbe-yellow',
      NSBE_BROWN: 'about-nsbe-brown',
      EXOSKELETON: 'about-exoskeleton'
    };
    while ((match = pattern.exec(text))) {
      appendBoldCommands(container, text.slice(lastIndex, match.index));
      const highlight = document.createElement('span');
      highlight.className = classes[match[1]];
      appendBoldCommands(highlight, match[2]);
      container.append(highlight);
      lastIndex = pattern.lastIndex;
    }
    appendBoldCommands(container, text.slice(lastIndex));
  }

  function printCommand(line, response) {
    const entry = document.createElement('div');
    const commandText = document.createElement('div');
    appendBoldCommands(commandText, `PS C:\\Ontario\\Hamilton> ${line}`);
    const responseText = document.createElement('div');
    const responseParts = response.split('[[GHANA_FLAG]]');
    appendHighlightedText(responseText, responseParts[0]);
    if (responseParts.length > 1) {
      const flag = document.createElement('span');
      flag.className = 'ghana-flag';
      [
        ['flag-red', '########'],
        ['flag-yellow', '###★###'],
        ['flag-green', '########']
      ].forEach(([className, text]) => {
        const row = document.createElement('span');
        row.className = className;
        if (text.includes('★')) {
          const star = document.createElement('span');
          star.className = 'flag-star';
          star.textContent = '★';
          row.append(document.createTextNode('###'), star, document.createTextNode('###'));
        } else {
          row.textContent = text;
        }
        flag.append(row);
      });
      responseText.append(flag);
      appendHighlightedText(responseText, responseParts.slice(1).join('[[GHANA_FLAG]]'));
    }
    if (response.startsWith('[opened in new tab]')) responseText.className = 'open-notice';
    entry.append(commandText, responseText);
    output.append(entry);
    const maxHeight = parseFloat(getComputedStyle(output).maxHeight);
    output.style.height = `${Math.min(entry.getBoundingClientRect().height, maxHeight)}px`;
    output.scrollTop = entry.getBoundingClientRect().top -
      output.getBoundingClientRect().top + output.scrollTop;
  }

  function openTarget(target) {
    if (target === 'portfolio') {
      const alreadyOpen = openTabs.some(tab => tab.name === 'portfolio');
      if (alreadyOpen) {
        activateTab('portfolio');
        return 'portfolio already opened';
      }
      addTab('portfolio', 'C:\\Portfolio', '', {
        kind: 'portfolio-menu',
        renderContent: tab => renderPortfolioMenu(tab)
      });
      return 'portfolio opened';
    }
    const url = openLinks[target];
    if (!url) return `unknown open target: ${target}`;
    const newTab = window.open(url, '_blank', 'noopener,noreferrer');
    if (!newTab) return `opened in new tab`;
    newTab.blur();
    window.focus();
    command.focus();
    return `[opened in new tab] ${target}`;
  }

  async function openVideo() {
    if (videoOpen) return 'video already opened';
    videoOpen = true;
    bg.hidden = false;
    await jukebox.run('play');
    return 'video opened';
  }

  async function closeVideo() {
    if (!videoOpen) return 'video already closed';
    videoOpen = false;
    await jukebox.run('pause');
    bg.hidden = true;
    return 'video closed';
  }

  const info = { about: '', projects: '', contact: '', writing: '' };
  let writingFiles = [];
  const openLinks = {};
  let helpText = '';
  let videoHelp = '';
  let welcomeText = '';
  let contentLoadError = null;
  let trackerConfig;
  let trackerData;
  const contentFiles = {
    about: 'content/about.txt',
    projects: 'content/projects.txt',
    contact: 'content/contact.txt',
    writing: 'content/writing.txt',
    help: 'content/help.txt',
    videoHelp: 'content/video-help.txt',
    welcome: 'content/welcome.txt',
    portfolio: 'content/portfolio.json'
  };

  async function readContent(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`Failed to load ${path}: ${response.status}`);
    return (await response.text()).replace(/\r\n/g, '\n').replace(/\n$/, '');
  }

  async function readJson(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`Failed to load ${path}: ${response.status}`);
    return response.json();
  }

  async function loadSiteContent() {
    const [about, projects, contact, writing, help, video, welcome, links, portfolio] = await Promise.all([
      readContent(contentFiles.about),
      readContent(contentFiles.projects),
      readContent(contentFiles.contact),
      readContent(contentFiles.writing),
      readContent(contentFiles.help),
      readContent(contentFiles.videoHelp),
      readContent(contentFiles.welcome),
      readJson('content/links.json'),
      readJson(contentFiles.portfolio)
    ]);
    Object.assign(info, { about, projects, contact, writing });
    Object.assign(openLinks, links);
    helpText = help;
    videoHelp = video;
    welcomeText = welcome;
    if (!Array.isArray(portfolio.categories)) throw new Error('Invalid portfolio index');
    portfolioCategories = await Promise.all(portfolio.categories.map(async category => {
      if (!category.name || !category.file) throw new Error('Invalid portfolio category');
      const page = await readJson(`content/portfolio/${category.file}`);
      if (!Array.isArray(page.entries)) throw new Error(`Invalid portfolio page: ${category.file}`);
      const entries = page.entries.map(entry => {
        if (!entry.title || typeof entry.url !== 'string') {
          throw new Error(`Invalid portfolio entry in ${category.file}`);
        }
        return { title: entry.title, url: entry.url };
      });
      return { name: page.title || category.name, entries };
    }));
  }

  const contentReady = loadSiteContent().catch(error => {
    console.error(error);
    contentLoadError = error;
  });

  async function loadTracker() {
    const configResponse = await fetch('content/tracker.json');
    if (!configResponse.ok) {
      throw new Error(`Failed to load content/tracker.json: ${configResponse.status}`);
    }
    trackerConfig = await configResponse.json();
    const commitRequest = fetch(
      `https://api.github.com/repos/${trackerConfig.repository}/commits?per_page=1`,
      { headers: { Accept: 'application/vnd.github+json' } }
    ).then(async response => {
      if (!response.ok) throw new Error(`GitHub commit lookup failed: ${response.status}`);
      const commits = await response.json();
      if (!commits[0]?.commit?.author?.date) throw new Error('GitHub returned no commit date');
      return commits[0].commit.author.date;
    });
    const visitsRequest = fetch(
      `https://page-views-api.ratneshc.com/api/v1/track?site=${encodeURIComponent(trackerConfig.visitorSite)}&path=${encodeURIComponent(trackerConfig.visitorPath)}`
    ).then(async response => {
      if (!response.ok) throw new Error(`Visit tracking failed: ${response.status}`);
      const viewsResponse = await fetch(
        `https://page-views-api.ratneshc.com/api/v1/views?site=${encodeURIComponent(trackerConfig.visitorSite)}&path=${encodeURIComponent(trackerConfig.visitorPath)}`
      );
      if (!viewsResponse.ok) throw new Error(`Visit lookup failed: ${viewsResponse.status}`);
      const result = await viewsResponse.json();
      if (typeof result.views !== 'number') throw new Error('Visit lookup returned no count');
      return result.views;
    });
    const [commitResult, visitsResult] = await Promise.allSettled([commitRequest, visitsRequest]);
    trackerData = {
      lastUpdated: commitResult.status === 'fulfilled' ? commitResult.value : null,
      visits: visitsResult.status === 'fulfilled' ? visitsResult.value : null
    };
    if (commitResult.status === 'rejected') console.error(commitResult.reason);
    if (visitsResult.status === 'rejected') console.error(visitsResult.reason);
  }

  const trackerReady = loadTracker().catch(error => {
    console.error(error);
    trackerData = { lastUpdated: null, visits: null };
  });
  const commandAliases = {
    comm: 'help',
    commands: 'help',
    hlep: 'help',
    hepl: 'help',
    abut: 'about',
    projets: 'projects',
    opne: 'open',
    clsoe: 'close',
    contcat: 'contact',
    writng: 'writing',
    clea: 'clear',
    vidoe: 'video',
    vido: 'video',
    plaay: 'play',
    paus: 'pause',
    togle: 'toggle',
    nxt: 'next',
    prv: 'prev',
    stauts: 'status',
    lst: 'list',
    skp: 'skip',
    bak: 'back',
    seak: 'seek',
    gto: 'goto'
  };
  const commandPrefixes = {
    help: 'help',
    abou: 'about',
    proj: 'projects',
    open: 'open',
    clos: 'close',
    cont: 'contact',
    writ: 'writing',
    clea: 'clear',
    vide: 'video',
    play: 'play',
    paus: 'pause',
    togg: 'toggle',
    next: 'next',
    prev: 'prev',
    stat: 'status',
    list: 'list',
    skip: 'skip',
    back: 'back',
    seek: 'seek',
    goto: 'goto'
  };
  function projectPrompt() {
    return `${info.projects}\n\nwhich project would you like to open (type 'c' to cancel.)`;
  }

  function renderWritingMenu(tab) {
    tab.contentElement.replaceChildren();
    tab.contentElement.append(document.createTextNode('Which do you want to read\n'));
    writingFiles.forEach((file, index) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'portfolio-option';
      option.textContent = `${index + 1}. ${file}`;
      option.addEventListener('click', () => selectWriting(index + 1));
      tab.contentElement.append(option);
    });
  }

  function appendPortfolioPrompt(container) {
    const line = document.createElement('div');
    const user = document.createElement('span');
    user.className = 'portfolio-user';
    user.textContent = 'futaa';
    const host = document.createElement('span');
    host.className = 'portfolio-host';
    host.textContent = '@MACU';
    const name = document.createElement('span');
    name.className = 'portfolio-name';
    name.textContent = ' ABCF13';
    const path = document.createElement('span');
    path.className = 'portfolio-path';
    path.textContent = ' ~';
    const prompt = document.createElement('span');
    prompt.className = 'portfolio-prompt';
    prompt.textContent = '\n$ history';
    line.append(user, host, name, path, prompt);
    container.append(line);
  }

  function renderPortfolioMenu(tab) {
    tab.contentElement.replaceChildren();
    appendPortfolioPrompt(tab.contentElement);
    portfolioCategories.forEach((category, index) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'portfolio-option';
      option.textContent = `${String(index + 1).padStart(6, ' ')} ${category.name}`;
      option.addEventListener('click', () => selectPortfolio(index + 1));
      tab.contentElement.append(option);
    });
  }

  function renderPortfolioCategory(tab, category) {
    tab.contentElement.replaceChildren();
    appendPortfolioPrompt(tab.contentElement);
    if (!category.entries.length) {
      tab.contentElement.append(document.createTextNode('\nNo items yet.'));
      return;
    }
    category.entries.forEach((entry, index) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'portfolio-option';
      const number = document.createElement('span');
      number.className = 'portfolio-entry-number';
      number.textContent = `${String(index + 1).padStart(6, ' ')}. `;
      const title = document.createElement('span');
      title.className = 'portfolio-link';
      title.textContent = entry.title;
      option.addEventListener('click', () => openPortfolioLink(entry));
      option.append(number, title);
      tab.contentElement.append(option);
    });
  }

  function openPortfolioLink(entry) {
    const newTab = window.open(entry.url, '_blank', 'noopener,noreferrer');
    if (!newTab) return `unable to open ${entry.title}`;
    newTab.blur();
    window.focus();
    command.focus();
    return `[opened in new tab] ${entry.title}`;
  }

  function selectPortfolio(number) {
    const tab = openTabs.find(item => item.kind === 'portfolio-menu');
    if (!tab) return 'portfolio is not open';
    const category = portfolioCategories[number - 1];
    if (!category) return 'no such portfolio category';
    const childName = `portfolio:${category.name}`;
    const existing = openTabs.find(item => item.name === childName);
    if (existing) {
      activateTab(childName);
      return `${category.name} already opened`;
    }
    addTab(childName, `C:\\Portfolio\\${category.name}`, '', {
      kind: 'portfolio-category',
      category,
      renderContent: tab => renderPortfolioCategory(tab, category)
    });
    return `opened ${category.name}`;
  }

  function selectPortfolioEntry(number) {
    const tab = openTabs[openTabs.length - 1];
    const entry = tab?.kind === 'portfolio-category'
      ? tab.category.entries[number - 1]
      : null;
    if (!entry) return 'no such portfolio item';
    return openPortfolioLink(entry);
  }

  function closePortfolio() {
    return removeTab('portfolio') ? 'portfolio closed' : 'portfolio already closed';
  }

  function activateTab(name) {
    const index = openTabs.findIndex(tab => tab.name === name);
    if (index < 0) return;
    const [tab] = openTabs.splice(index, 1);
    openTabs.push(tab);
    activeTab = name;
    openTabs.forEach((item, itemIndex) => {
      item.element.style.zIndex = String(itemIndex + 2);
    });
    tab.titleTextElement.textContent = tab.title;
    if (tab.renderContent) tab.renderContent(tab);
    else tab.contentElement.textContent = tab.content;
  }

  function makeDraggable(tab) {
    tab.titleElement.addEventListener('pointerdown', event => {
      if (event.target.closest('button')) return;
      event.preventDefault();
      activateTab(tab.name);
      const rect = tab.element.getBoundingClientRect();
      const offsetX = event.clientX - rect.left;
      const offsetY = event.clientY - rect.top;
      tab.element.style.left = `${rect.left}px`;
      tab.element.style.top = `${rect.top}px`;
      tab.element.style.right = 'auto';
      tab.element.style.transform = 'none';
      windowLayer.classList.add('is-dragging');
      const move = moveEvent => {
        const maxLeft = Math.max(0, window.innerWidth - rect.width);
        const maxTop = Math.max(0, window.innerHeight - tab.titleElement.offsetHeight);
        const left = Math.max(0, Math.min(maxLeft, moveEvent.clientX - offsetX));
        const top = Math.max(0, Math.min(maxTop, moveEvent.clientY - offsetY));
        tab.element.style.left = `${left}px`;
        tab.element.style.top = `${top}px`;
      };
      const stop = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', stop);
        windowLayer.classList.remove('is-dragging');
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop, { once: true });
    });
  }

  function addTab(name, title, content, { kind = name, renderContent = null, category = null } = {}) {
    const element = document.createElement('section');
    element.className = 'portfolio-window is-opening';
    element.setAttribute('aria-label', title);
    const titleElement = document.createElement('div');
    titleElement.className = 'portfolio-title';
    const titleTextElement = document.createElement('span');
    titleTextElement.textContent = title;
    const closeButton = document.createElement('button');
    closeButton.type = 'button';
    closeButton.textContent = 'X';
    closeButton.setAttribute('aria-label', `Close ${title}`);
    titleElement.append(titleTextElement, closeButton);
    const contentElement = document.createElement('div');
    contentElement.className = 'portfolio-content';
    contentElement.textContent = content;
    element.append(titleElement, contentElement);
    const offset = openTabs.length * 2;
    element.style.right = `${1 + offset}rem`;
    element.style.top = `calc(50% + ${offset}rem)`;
    windowLayer.append(element);
    const tab = {
      name, title, content, kind, element, titleElement, titleTextElement,
      contentElement, timer: 0, renderContent, category
    };
    openTabs.push(tab);
    makeDraggable(tab);
    closeButton.addEventListener('click', async event => {
      event.stopPropagation();
      const closedTitle = tab.title;
      if (tab.kind === 'writing-menu') {
        await closeWriting();
      } else if (tab.kind === 'portfolio-menu') {
        closePortfolio();
      } else {
        removeTab(tab.name);
      }
      printCommand('close', `${closedTitle} tab has been closed`);
    });
    activateTab(name);
    tab.timer = setTimeout(() => {
      tab.timer = 0;
      element.classList.remove('is-opening');
      element.classList.add('is-open');
    }, 180);
    return tab;
  }

  function removeTab(name) {
    const index = openTabs.findIndex(tab => tab.name === name);
    if (index < 0) return false;
    const [tab] = openTabs.splice(index, 1);
    clearTimeout(tab.timer);
    tab.element.remove();
    if (openTabs.length === 0) {
      activeTab = '';
      return true;
    }
    activateTab(openTabs[openTabs.length - 1].name);
    return true;
  }

  async function closeTopTab() {
    if (!openTabs.length) return null;
    const name = openTabs[openTabs.length - 1].name;
    const tab = openTabs[openTabs.length - 1];
    if (tab.kind === 'writing-menu') return closeWriting();
    if (tab.kind === 'portfolio-menu') return closePortfolio();
    return removeTab(name) ? 'tab closed' : null;
  }

  function closeNamedTab(name) {
    const target = name.trim().replace(/^['"]|['"]$/g, '').replace(/\.txt$/i, '').toLowerCase();
    if (!target) return 'usage: close <tab_name>';
    if (target === 'portfolio') return closePortfolio();
    if (target === 'writing' || target === 'writings') return closeWriting();

    const tab = openTabs.find(item => {
      const titleName = item.title.split('\\').pop().replace(/\.txt$/i, '').toLowerCase();
      const tabName = item.name.toLowerCase();
      const categoryName = item.category?.name?.toLowerCase();
      return titleName === target
        || tabName === target
        || tabName === `portfolio:${target}`
        || tabName === `writing:${target}`
        || categoryName === target;
    });
    return tab
      ? (removeTab(tab.name) ? `${tab.title} closed` : 'tab already closed')
      : `${name} tab is not open`;
  }

  async function loadWritingFiles() {
    const response = await fetch('writings/index.json');
    if (!response.ok) throw new Error(`Failed to load writings/index.json: ${response.status}`);
    const files = await response.json();
    if (!Array.isArray(files) || files.some(file => typeof file !== 'string' || !file.endsWith('.txt'))) {
      throw new Error('Invalid writings index');
    }
    writingFiles = files;
  }

  async function openWriting() {
    const existing = openTabs.find(tab => tab.kind === 'writing-menu');
    if (existing) {
      activateTab(existing.name);
      return 'writing already opened';
    }
    addTab('writing', 'C:\\Writing\\', 'Loading writings...', {
      kind: 'writing-menu',
      renderContent: tab => renderWritingMenu(tab)
    });
    try {
      await loadWritingFiles();
      const tab = openTabs.find(item => item.name === 'writing');
      activateTab('writing');
    } catch (error) {
      console.error(error);
      const tab = openTabs.find(item => item.name === 'writing');
      tab.content = 'Unable to load writings.';
      tab.renderContent = null;
      activateTab('writing');
    }
    return 'select a writing';
  }

  async function closeWriting() {
    return removeTab('writing') ? 'writing closed' : 'writing already closed';
  }

  async function selectWriting(number) {
    const file = writingFiles[number - 1];
    if (!file) return 'no such writing';
    const childName = `writing:${file}`;
    const existing = openTabs.find(item => item.name === childName);
    if (existing) {
      activateTab(childName);
      return `${file} already opened`;
    }
    try {
      const response = await fetch(`writings/${file}`);
      if (!response.ok) throw new Error(`Failed to load writings/${file}: ${response.status}`);
      addTab(childName, `C:\\Writing\\${file}`, await response.text(), { kind: 'writing-entry' });
      return `reading ${file}`;
    } catch (error) {
      console.error(error);
      addTab(
        childName,
        `C:\\Writing\\${file}`,
        `Unable to load writings\\${file}.`,
        { kind: 'writing-entry' }
      );
      return `unable to load ${file}`;
    }
  }

  let byteMemory = 0;

  function looksLikeByteExpression(line) {
    return /^(mem\s*=|mem(?:\s*(?:\+\+|--))?|(?:\+\+|--)\s*mem\b|true\b|false\b|!|\(?\s*[+\-]?\s*\d)/i.test(line)
      || /\bmem\b|&&|\|\||==|!=|<=|>=|(?<!\b[a-z])[+\-*\/%<>]/i.test(line);
  }

  function wrapByte(value) {
    return ((Math.trunc(value) % 256) + 256) % 256;
  }

  function evaluateByteExpression(expression) {
    const tokens = [];
    const pattern = /\s*(>=|<=|==|!=|&&|\|\||\+\+|--|[()+\-*/%=<>!]|(?:0[xX][0-9a-fA-F]+|\d+|true|false|mem))/gy;
    let position = 0;
    while (position < expression.length) {
      pattern.lastIndex = position;
      const match = pattern.exec(expression);
      if (!match) return null;
      tokens.push(match[1]);
      position = pattern.lastIndex;
    }
    if (!tokens.length) return null;

    let index = 0;
    const peek = () => tokens[index];
    const take = () => tokens[index++];

    function parsePrimary() {
      const token = take();
      if (!token) throw new Error('expected a value');
      if (/^0[xX][0-9a-fA-F]+$/.test(token) || /^\d+$/.test(token)) {
        return wrapByte(Number(token));
      }
      if (token.toLowerCase() === 'true') return 1;
      if (token.toLowerCase() === 'false') return 0;
      if (token.toLowerCase() === 'mem') return byteMemory;
      if (token === '(') {
        const value = parseLogicalOr();
        if (take() !== ')') throw new Error('missing closing parenthesis');
        return value;
      }
      throw new Error(`unknown value: ${token}`);
    }

    function parsePostfix() {
      const start = index;
      let value = parsePrimary();
      if (peek() === '++') {
        take();
        if (tokens[start]?.toLowerCase() === 'mem') {
          byteMemory = wrapByte(byteMemory + 1);
        } else {
          throw new Error('++ requires mem');
        }
        return value;
      }
      if (peek() === '--') {
        take();
        if (tokens[start]?.toLowerCase() === 'mem') {
          byteMemory = wrapByte(byteMemory - 1);
        } else {
          throw new Error('-- requires mem');
        }
        return value;
      }
      return value;
    }

    function parseUnary() {
      const token = peek();
      if (token === '+' || token === '-') {
        take();
        const value = parseUnary();
        return token === '-' ? wrapByte(-value) : wrapByte(value);
      }
      if (token === '!') {
        take();
        return parseUnary() === 0 ? 1 : 0;
      }
      if (token === '++') {
        take();
        if (peek() !== 'mem') throw new Error('++ requires mem');
        take();
        byteMemory = wrapByte(byteMemory + 1);
        return byteMemory;
      }
      if (token === '--') {
        take();
        if (peek() !== 'mem') throw new Error('-- requires mem');
        take();
        byteMemory = wrapByte(byteMemory - 1);
        return byteMemory;
      }
      return parsePostfix();
    }

    function parseMultiplicative() {
      let value = parseUnary();
      while (peek() === '*' || peek() === '/' || peek() === '%') {
        const operator = take();
        const right = parseUnary();
        if ((operator === '/' || operator === '%') && right === 0) {
          throw new Error('division by zero');
        }
        if (operator === '*') value = wrapByte(value * right);
        if (operator === '/') value = wrapByte(Math.trunc(value / right));
        if (operator === '%') value = wrapByte(value % right);
      }
      return value;
    }

    function parseAdditive() {
      let value = parseMultiplicative();
      while (peek() === '+' || peek() === '-') {
        const operator = take();
        const right = parseMultiplicative();
        value = wrapByte(operator === '+' ? value + right : value - right);
      }
      return value;
    }

    function parseComparison() {
      let value = parseAdditive();
      while (['<', '<=', '>', '>=', '==', '!='].includes(peek())) {
        const operator = take();
        const right = parseAdditive();
        if (operator === '<') value = value < right ? 1 : 0;
        if (operator === '<=') value = value <= right ? 1 : 0;
        if (operator === '>') value = value > right ? 1 : 0;
        if (operator === '>=') value = value >= right ? 1 : 0;
        if (operator === '==') value = value === right ? 1 : 0;
        if (operator === '!=') value = value !== right ? 1 : 0;
      }
      return value;
    }

    function parseLogicalAnd() {
      let value = parseComparison();
      while (peek() === '&&') {
        take();
        value = value !== 0 && parseComparison() !== 0 ? 1 : 0;
      }
      return value;
    }

    function parseLogicalOr() {
      let value = parseLogicalAnd();
      while (peek() === '||') {
        take();
        value = value !== 0 || parseLogicalAnd() !== 0 ? 1 : 0;
      }
      return value;
    }

    try {
      let value;
      if (/^mem$/i.test(tokens[0] || '') && tokens[1] === '=') {
        take();
        take();
        value = parseLogicalOr();
        if (index !== tokens.length) throw new Error('unexpected text');
        byteMemory = wrapByte(value);
      } else {
        value = parseLogicalOr();
        if (index !== tokens.length) throw new Error('unexpected text');
      }
      const isBoolean = tokens.some(token =>
        ['true', 'false', '==', '!=', '<', '<=', '>', '>=', '&&', '||', '!'].includes(token.toLowerCase())
      );
      return { value: wrapByte(value), boolean: isBoolean };
    } catch (error) {
      return { error: error.message };
    }
  }

  async function runCommand(line) {
    await contentReady;
    if (contentLoadError) return `content unavailable: ${contentLoadError.message}`;
    const booleanLine = line.trim();
    if (/^(?:!?\s*(?:true|false))(?:\s*(?:&&|\|\|)\s*!?\s*(?:true|false))*$/i.test(booleanLine)) {
      const parts = booleanLine.split(/\s*(\&\&|\|\|)\s*/);
      let result = parts[0].trim().startsWith('!')
        ? parts[0].trim().slice(1).toLowerCase() !== 'true'
        : parts[0].trim().toLowerCase() === 'true';
      for (let i = 1; i < parts.length; i += 2) {
        const valueText = parts[i + 1].trim();
        const value = valueText.startsWith('!')
          ? valueText.slice(1).toLowerCase() !== 'true'
          : valueText.toLowerCase() === 'true';
        result = parts[i] === '&&' ? result && value : result || value;
      }
      return result ? 'true' : 'false';
    }
    const calculation = evaluateByteExpression(line);
    if (calculation) {
      if (calculation.error) {
        if (looksLikeByteExpression(line)) return `math error: ${calculation.error}`;
      } else {
        if (/^(mem\s*=|mem\+\+|mem--|\+\+mem|--mem)/i.test(line)) {
          return `mem = ${byteMemory}`;
        }
        if (looksLikeByteExpression(line)) {
          return calculation.boolean
            ? (calculation.value ? 'true' : 'false')
            : String(calculation.value);
        }
      }
    }
    const [name, ...args] = line.trim().split(/\s+/);
    const commandName = name.toLowerCase();
    const aliasedName = commandAliases[commandName] || commandName;
    const normalizedName = commandPrefixes[aliasedName.slice(0, 4)] || aliasedName;
    switch (normalizedName) {
      case '': return '';
      case 'help':
        return helpText;
      case 'video':
        return videoHelp;
      case 'about':
      case 'projects':
      case 'contact':
        return info[normalizedName];
      case 'writing':
        return openWriting();
      case 'portfolio':
        return openTarget('portfolio');
      case 'clear':
        clearTerminal();
        return '';
      case 'close':
        if (!args[0]) {
          if (openTabs.length) return closeTopTab();
          closeSitePromptActive = true;
          return 'are you sure? (Y/N)';
        }
        switch (args[0].toLowerCase()) {
          case 'video':
          case 'ascii':
          case 'player':
            return closeVideo();
          case 'site':
          case 'tab':
            closeSitePromptActive = true;
            return 'are you sure? (Y/N)';
          default:
            return closeNamedTab(args.join(' '));
        }
      case 'open': {
        const target = (args[0] || '').toLowerCase();
        if (!target) {
          openPromptActive = true;
          return 'usage: open <project_name|video|linkedin|github|resume|cv>\n\noptions:\nproject\nvideo\nlinkedin\ngithub\nresume\ncv\npress c to cancel.';
        }
        if (target === 'project' || target === 'projects') {
          projectPromptActive = true;
          return projectPrompt();
        }
        if (target === 'video') return openVideo();
        if (target === 'writing' || target === 'writings') return openWriting();
        return openTarget(target);
      }
      default:
        return jukebox.run([normalizedName, ...args].join(' '));
    }
  }

  document.getElementById('command-line').addEventListener('submit', async event => {
    event.preventDefault();
    const line = command.value.trim();
    if (!line) return;
    history.push(line);
    historyIndex = history.length;
    command.value = '';
    let response = null;
    const topTab = openTabs[openTabs.length - 1];
    const entered = line.toLowerCase();
    if (topTab?.kind === 'portfolio-menu') {
      const categoryIndex = portfolioCategories.findIndex(
        category => category.name.toLowerCase() === entered
      );
      response = /^\d+$/.test(line)
        ? selectPortfolio(Number(line))
        : categoryIndex >= 0
          ? selectPortfolio(categoryIndex + 1)
          : null;
    } else if (topTab?.kind === 'portfolio-category') {
      const entryIndex = topTab.category.entries.findIndex(
        entry => entry.title.toLowerCase() === entered
      );
      response = /^\d+$/.test(line)
        ? selectPortfolioEntry(Number(line))
        : entryIndex >= 0
          ? selectPortfolioEntry(entryIndex + 1)
          : null;
    } else if (topTab?.kind === 'writing-menu' && /^\d+$/.test(line)) {
      response = await selectWriting(Number(line));
    } else if (topTab?.kind === 'writing-menu') {
      const fileIndex = writingFiles.findIndex(file => file.toLowerCase() === entered);
      response = fileIndex >= 0 ? await selectWriting(fileIndex + 1) : null;
    }
    if (response !== null) {
      printCommand(line, response);
      updateCursor();
      return;
    }
    if (response === null && closeSitePromptActive) {
      closeSitePromptActive = false;
      const answer = line.toLowerCase();
      if (answer === 'y' || answer === 'yes') {
        window.close();
        response = 'closing site';
      } else if (answer === 'n' || answer === 'no') {
        response = 'close cancelled';
      } else {
        closeSitePromptActive = true;
        response = 'are you sure? (Y/N)';
      }
    } else if (response === null && (openPromptActive || projectPromptActive)) {
      const selectingProject = projectPromptActive;
      openPromptActive = false;
      projectPromptActive = false;
      const entered = line.toLowerCase().split(/\s+/);
      const target = entered[0] === 'open' ? entered[1] : entered[0];
      if (target === 'c') {
        response = 'open cancelled';
      } else if (!target) {
        response = 'usage: open <project_name>';
      } else if (!selectingProject && (target === 'project' || target === 'projects')) {
        projectPromptActive = true;
        response = projectPrompt();
      } else {
        response = openTarget(target);
      }
    } else if (response === null) {
      response = await runCommand(line);
    }
    printCommand(line, response);
    updateCursor();
  });

  command.addEventListener('keydown', event => {
    if (event.ctrlKey && event.key.toLowerCase() === 'c') {
      event.preventDefault();
      openPromptActive = false;
      projectPromptActive = false;
      closeSitePromptActive = false;
      clearTerminal();
      command.value = '';
      updateCursor();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      historyIndex = Math.max(0, historyIndex - 1);
      command.value = history[historyIndex] || '';
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      historyIndex = Math.min(history.length, historyIndex + 1);
      command.value = history[historyIndex] || '';
    }
  });

  Promise.all([contentReady, trackerReady]).then(() => {
    renderTracker();
    if (contentLoadError) {
      print(`content unavailable: ${contentLoadError.message}`);
      return;
    }
    welcomeText.split('\n').forEach(print);
  });
  jukebox.init({ random: true, exclude: ['002', '004'] })
    .catch(e => { console.error(e); document.getElementById('bg').textContent = 'Error: ' + e.message; });
</script>
</body>
