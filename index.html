<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio terminal</title>
<style>
  :root { --bg:#0b0b0f; --fg:#e8e8ee; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --fg:#16161a; } }
  html { background:var(--bg); }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--fg); }

  #stage-wrap { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
#stage { position:absolute; right: 7rem; top:40%; transform:translateY(-50%); width:max-content; max-width:100%; }
  #bg {
    margin:0; font:10px/10px ui-monospace, Menlo, Consolas, monospace;
    white-space:pre; opacity:.55; user-select:none;
  }

  #terminal {
    position:relative; z-index:1; box-sizing:border-box; width:min(48rem, calc(100% - 3rem));
    height:min(51rem, calc(100vh - 2rem)); margin:1rem 2rem; padding:1.25rem;
    overflow:hidden; background:color-mix(in srgb, #000 85%, var(--bg));
    border:1px solid color-mix(in srgb, var(--fg) 15%, transparent);
    box-shadow:0 .5rem 1.5rem #0005; font:15px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  #output {
    max-height:27em; overflow-y:auto; overflow-x:hidden;
    white-space:pre-wrap; overflow-wrap:anywhere;
    scrollbar-width:none;
  }
  #output::-webkit-scrollbar { display:none; }
  #command-line { display:flex; align-items:baseline; }
  #prompt { flex:none; }
  #command-wrap { position:relative; flex:1; min-width:0; }
  #command {
    width:100%; min-width:0; padding:0; border:0; outline:0; color:inherit;
    caret-color:transparent;
    background:transparent; font:inherit;
  }
  #block-cursor {
    position:absolute; top:.2em; left:0; width:.6em; height:1em;
    box-sizing:border-box; background:transparent; border:1px solid var(--fg);
    pointer-events:none;
  }
  #command-wrap:focus-within #block-cursor { background:#fff; border-color:#fff; }
  #measure {
    position:absolute; visibility:hidden; white-space:pre; font:inherit;
  }
  @media (max-width: 600px) {
    #terminal { width:calc(100% - 2rem); height:calc(100vh - 2rem); margin:1rem; padding:.9rem; }
    #stage { right:0; }
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <pre id="bg"></pre>
  </div>
</div>
<section id="terminal" aria-label="Interactive portfolio terminal">
  <div id="output" aria-live="polite"></div>
  <form id="command-line">
    <span id="prompt">PS C:\Ontario\Hamilton&gt;&nbsp;</span>
    <span id="command-wrap">
      <input id="command" name="command" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="Terminal command" autofocus>
      <span id="block-cursor" aria-hidden="true"></span>
      <span id="measure" aria-hidden="true"></span>
    </span>
  </form>
</section>
<script src="ascii-player.js"></script>
<script>
  const player = new AsciiPlayer(document.getElementById('bg'));
  const jukebox = new Jukebox(player, { dir: 'clips' });  // clips/ holds clip_AAA.txt and playlist.json

  const output = document.getElementById('output');
  const command = document.getElementById('command');
  const blockCursor = document.getElementById('block-cursor');
  const measure = document.getElementById('measure');
  const history = [];
  let historyIndex = 0;

  function updateCursor() {
    measure.textContent = command.value.slice(0, command.selectionStart ?? command.value.length);
    blockCursor.style.left = `${Math.min(measure.getBoundingClientRect().width, command.clientWidth)}px`;
  }

  command.addEventListener('input', updateCursor);
  command.addEventListener('keyup', updateCursor);
  command.addEventListener('click', updateCursor);
  command.addEventListener('focus', updateCursor);
  updateCursor();

  function print(text = '') {
    output.append(document.createTextNode(text + '\n'));
    output.scrollTop = output.scrollHeight;
  }

  const info = {
    about: 'Hello.\nThis portfolio is an interactive terminal over an ASCII video background.',
    projects: 'projects\n  ascii-player  ASCII video background with playlist controls',
    contact: 'Contact information is not configured yet.'
  };
  const openLinks = {
    'ascii-player': 'https://github.com/ABCF13/portfolio-site',
    'portfolio-site': 'https://github.com/ABCF13/portfolio-site',
    linkedin: 'https://www.linkedin.com/in/alifuta/',
    github: 'https://github.com/ABCF13',
    resume: 'Ali_Resume.pdf',
    cv: 'Ali_Cv.pdf'
  };

  async function runCommand(line) {
    const [name, ...args] = line.trim().split(/\s+/);
    switch (name.toLowerCase()) {
      case '': return '';
      case 'help':
        return 'Available commands:\n  about     Learn about me\n  projects  View projects\n  open      Open a project, profile, resume, or CV\n  contact   View contact information\n  clear     Clear the terminal\nVideo player commands:\n  play      Play the background\n  pause     Pause the background\n  toggle    Toggle playback\n  next      Play the next clip\n  prev      Play the previous clip\n  status    Show playback status\n  list      List available clips\n  skip      Skip seconds (default: 10)\n  back      Go back seconds (default: 10)\n  seek      Seek to seconds or m:ss\n  goto      Load a clip by id';
      case 'about':
      case 'projects':
      case 'contact':
        return info[name.toLowerCase()];
      case 'clear':
        output.replaceChildren();
        return '';
      case 'open': {
        const target = (args[0] || '').toLowerCase();
        const url = openLinks[target];
        if (!target) return 'usage: open <project_name|linkedin|github|resume|cv>';
        if (!url) return `unknown open target: ${target}`;
        window.open(url, '_blank', 'noopener,noreferrer');
        return `opening ${target}`;
      }
      default:
        return jukebox.run([name, ...args].join(' '));
    }
  }

  document.getElementById('command-line').addEventListener('submit', async event => {
    event.preventDefault();
    const line = command.value.trim();
    if (!line) return;
    history.push(line);
    historyIndex = history.length;
    print(`PS C:\\Ontario\\Hamilton> ${line}`);
    command.value = '';
    updateCursor();
    print(await runCommand(line));
  });

  command.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      historyIndex = Math.max(0, historyIndex - 1);
      command.value = history[historyIndex] || '';
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      historyIndex = Math.min(history.length, historyIndex + 1);
      command.value = history[historyIndex] || '';
    }
  });

  print('Welcome to my portfolio.');
  print('Type "help" to see available commands.');
  jukebox.init()
    .catch(e => { console.error(e); document.getElementById('bg').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
